name: ci

on:
  push:
    branches: [main, "devin/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Matches the rtk env documented in AGENTS.md: helps substrate-wasm-builder
  # locate the workspace root.
  WASM_BUILD_WORKSPACE_HINT: ${{ github.workspace }}

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins 1.88.0; dtolnay@master honors explicit
      # toolchain + components (the @stable tag would not read the pin).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Lint gate only; the real Wasm build is covered by the wasm-build job.
      SKIP_WASM_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev protobuf-compiler libudev-dev pkg-config
      - name: Resolve bindgen environment
        run: |
          set -eux
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib -name 'libclang.so' | head -n1)")" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include) -I/usr/include/x86_64-linux-gnu -I/usr/include" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
      # `-A` allowances below suppress lints the devin/foundation-design
      # baseline already violates in files owned by other workstreams
      # (verified on rustc 1.88.0):
      #   useless_conversion             runtime/src/genesis_config_presets.rs
      #   uninlined_format_args          node/src/{command,service,miner,benchmarking}.rs
      #   result_large_err               node/src/{main,command,service}.rs
      #   double_comparisons             node/src/miner.rs (test)
      #   default_constructed_unit_structs  pallets/pallet-ghost-consensus/src/mock.rs
      #   useless_vec                    pallets/pallet-ghost-consensus/src/tests.rs
      # Remove each `-A` as its owners fix the violating code.
      - run: >-
          cargo clippy --workspace --all-targets --
          -D warnings
          -A clippy::default_constructed_unit_structs
          -A clippy::useless_vec
          -A clippy::useless_conversion
          -A clippy::uninlined_format_args
          -A clippy::result_large_err
          -A clippy::double_comparisons

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Native-test pass only; node readiness is proven by the wasm-build,
      # build-node and e2e jobs (AGENTS.md: no readiness claims from SKIP builds).
      SKIP_WASM_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev protobuf-compiler libudev-dev pkg-config
      - name: Resolve bindgen environment
        run: |
          set -eux
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib -name 'libclang.so' | head -n1)")" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include) -I/usr/include/x86_64-linux-gnu -I/usr/include" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
      - run: cargo test --workspace

  wasm-build:
    name: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev protobuf-compiler libudev-dev pkg-config
      - name: Resolve bindgen environment
        run: |
          set -eux
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib -name 'libclang.so' | head -n1)")" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include) -I/usr/include/x86_64-linux-gnu -I/usr/include" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
      # Real Wasm build via substrate-wasm-builder (no SKIP_WASM_BUILD).
      # `frame-system-rpc-runtime-api/std` is enabled explicitly because
      # runtime/Cargo.toml declares the dependency but omits it from `std` —
      # building the runtime standalone (-p) otherwise compiles that crate
      # no_std and fails with E0433 (node builds hide it via feature
      # unification). Drop the flag once the manifest is fixed upstream.
      - run: cargo build -p solochain-template-runtime --features "frame-system-rpc-runtime-api/std"

  build-node:
    name: build-node
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev protobuf-compiler libudev-dev pkg-config
      - name: Resolve bindgen environment
        run: |
          set -eux
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib -name 'libclang.so' | head -n1)")" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include) -I/usr/include/x86_64-linux-gnu -I/usr/include" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --release --bin ghost-node
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-node
          path: target/release/ghost-node
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, wasm-build, build-node]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Keep a real toolchain around so the cargo shim below can delegate any
      # cargo call other than the build it intentionally skips.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: actions/download-artifact@v4
        with:
          name: ghost-node
          path: /tmp/ghost-target/debug
      - name: Verify downloaded binary
        run: |
          chmod +x /tmp/ghost-target/debug/ghost-node
          /tmp/ghost-target/debug/ghost-node --version
      # scripts/e2e-ghost.sh honors SKIP_BUILD=1 + GHOST_NODE_BIN, so the
      # CI-built artifact is exercised directly — no cargo rebuild needed.
      # It replaces e2e-local.sh as the e2e gate: the `ghost` CLI's
      # status/mine subcommands that e2e-local.sh drives were removed when
      # the PoW path landed (only `verify-pow` remains), so e2e-local.sh
      # cannot pass on this tree.
      - name: Run e2e-ghost.sh
        env:
          SKIP_BUILD: "1"
          GHOST_NODE_BIN: /tmp/ghost-target/debug/ghost-node
        run: bash scripts/e2e-ghost.sh

  e2e-faults:
    name: e2e-faults
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, wasm-build, build-node]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: actions/download-artifact@v4
        with:
          name: ghost-node
          path: /tmp/ghost-target/debug
      - name: Verify downloaded binary
        run: |
          chmod +x /tmp/ghost-target/debug/ghost-node
          /tmp/ghost-target/debug/ghost-node --version
      # Adversarial gate: miner halt/resume, committee member offline,
      # GRANDPA equivocation -> on-chain slash. Same artifact reuse
      # pattern as the e2e job.
      - name: Run e2e-faults.sh
        env:
          SKIP_BUILD: "1"
          GHOST_NODE_BIN: /tmp/ghost-target/debug/ghost-node
        run: bash scripts/e2e-faults.sh

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # cargo audit against the committed lockfile (RustSec advisory DB).
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
