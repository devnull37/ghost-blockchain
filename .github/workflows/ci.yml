name: ci

on:
  push:
    branches: [main, "devin/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Matches the rtk env documented in AGENTS.md: helps substrate-wasm-builder
  # locate the workspace root.
  WASM_BUILD_WORKSPACE_HINT: ${{ github.workspace }}

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins 1.88.0; dtolnay@master honors explicit
      # toolchain + components (the @stable tag would not read the pin).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Lint gate only; the real Wasm build is covered by the wasm-build job.
      SKIP_WASM_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev protobuf-compiler libudev-dev pkg-config
      - name: Resolve bindgen environment
        run: |
          set -eux
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib -name 'libclang.so' | head -n1)")" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include) -I/usr/include/x86_64-linux-gnu -I/usr/include" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Native-test pass only; node readiness is proven by the wasm-build,
      # build-node and e2e jobs (AGENTS.md: no readiness claims from SKIP builds).
      SKIP_WASM_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev protobuf-compiler libudev-dev pkg-config
      - name: Resolve bindgen environment
        run: |
          set -eux
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib -name 'libclang.so' | head -n1)")" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include) -I/usr/include/x86_64-linux-gnu -I/usr/include" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
      - run: cargo test --workspace

  wasm-build:
    name: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev protobuf-compiler libudev-dev pkg-config
      - name: Resolve bindgen environment
        run: |
          set -eux
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib -name 'libclang.so' | head -n1)")" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include) -I/usr/include/x86_64-linux-gnu -I/usr/include" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
      # Real Wasm build via substrate-wasm-builder (no SKIP_WASM_BUILD).
      - run: cargo build -p solochain-template-runtime

  build-node:
    name: build-node
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev protobuf-compiler libudev-dev pkg-config
      - name: Resolve bindgen environment
        run: |
          set -eux
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib -name 'libclang.so' | head -n1)")" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include) -I/usr/include/x86_64-linux-gnu -I/usr/include" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --release --bin ghost-node
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-node
          path: target/release/ghost-node
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, wasm-build, build-node]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Keep a real toolchain around so the cargo shim below can delegate any
      # cargo call other than the build it intentionally skips.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: actions/download-artifact@v4
        with:
          name: ghost-node
          path: /tmp/ghost-target/debug
      - name: Verify downloaded binary
        run: |
          chmod +x /tmp/ghost-target/debug/ghost-node
          /tmp/ghost-target/debug/ghost-node --version
      # scripts/e2e-local.sh unconditionally runs `cargo build --bin ghost-node`
      # (its BIN is $CARGO_TARGET_DIR/debug/ghost-node, and the file must not be
      # modified). The release artifact is seeded at exactly that path, and this
      # shim turns the script's rebuild into a no-op so the suite exercises the
      # CI-built binary itself — the build-node job already proved it compiles.
      - name: Install cargo shim (skip redundant rebuild)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ci-bin"
          {
            echo '#!/usr/bin/env bash'
            echo 'if [[ "$*" == "build --bin ghost-node" ]]; then'
            echo '  echo "[ci shim] cargo build skipped; using artifact ghost-node"'
            echo '  exit 0'
            echo 'fi'
            echo 'exec "$HOME/.cargo/bin/cargo" "$@"'
          } > "$RUNNER_TEMP/ci-bin/cargo"
          chmod +x "$RUNNER_TEMP/ci-bin/cargo"
          echo "$RUNNER_TEMP/ci-bin" >> "$GITHUB_PATH"
      - name: Run e2e-local.sh
        run: bash scripts/e2e-local.sh
