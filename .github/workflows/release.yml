name: release

# Tagged-release pipeline: `git tag v*` -> release binary + SHA256
# checksums + bundled chainspecs + generated release notes, attached to a
# GitHub release. Docker image publishing requires a registry credential —
# add the docker job once one exists; the Dockerfile builds standalone
# regardless.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # cosign keyless signing via GitHub OIDC

env:
  CARGO_TERM_COLOR: always
  WASM_BUILD_WORKSPACE_HINT: ${{ github.workspace }}

jobs:
  srtool-wasm:
    name: reproducible runtime wasm (srtool)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime wasm twice in srtool and verify determinism
        run: |
          set -eux
          mkdir -p runtime/target && chmod -R a+w runtime/target
          build() {
            docker run --rm \
              -e PACKAGE=solochain-template-runtime \
              -e RUNTIME_DIR=runtime \
              -v "$PWD":/build \
              paritytech/srtool:1.88.0 build 2>&1 | tee /tmp/srtool-$1.log
            sha256sum runtime/target/srtool/release/wbuild/solochain-template-runtime/solochain_template_runtime.compact.compressed.wasm \
              | awk '{print $1}' > /tmp/srtool-$1.sha
          }
          build 1
          rm -rf runtime/target/srtool
          build 2
          diff /tmp/srtool-1.sha /tmp/srtool-2.sha
          cat /tmp/srtool-1.sha
      - name: Package srtool artifacts
        run: |
          set -eux
          mkdir -p dist-srtool
          cp runtime/target/srtool/release/wbuild/solochain-template-runtime/solochain_template_runtime.compact.compressed.wasm \
             dist-srtool/ghost-runtime-srtool.wasm
          (cd dist-srtool && sha256sum * > SHA256SUMS.txt)
          cp /tmp/srtool-1.log dist-srtool/srtool-build.log
      - uses: sigstore/cosign-installer@v3
      - name: Sign srtool artifacts (cosign keyless)
        run: |
          set -eux
          for f in dist-srtool/*; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
      - name: Attach srtool artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist-srtool/* --clobber

  release-binary:
    name: binary + checksums
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev protobuf-compiler libudev-dev pkg-config
      - name: Resolve bindgen environment
        run: |
          set -eux
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib -name 'libclang.so' | head -n1)")" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include) -I/usr/include/x86_64-linux-gnu -I/usr/include" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Build release ghost-node
        run: cargo build --release --bin ghost-node
      - name: Package artifacts
        run: |
          set -eux
          mkdir dist
          cp target/release/ghost-node dist/
          # The runtime wasm is THE upgrade artifact — release it with the
          # node so validators can verify a runtime upgrade against the tag.
          cp target/release/wbuild/solochain-template-runtime/solochain_template_runtime.wasm \
             dist/ghost-runtime.wasm
          cp chainspecs/local.json dist/ghost-local.json 2>/dev/null || true
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist
      - name: Sign artifacts (cosign keyless)
        uses: sigstore/cosign-installer@v3
      - name: Produce signatures
        run: |
          set -eux
          for f in dist/*; do
            cosign sign-blob --yes \
              --bundle "${f}.sigstore.json" \
              "$f"
          done
          ls -la dist
      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release create "${{ github.ref_name }}" \
            --title "Ghost ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
          # Append the verification instructions under the auto-notes.
          BODY=$(gh release view "${{ github.ref_name }}" --json body -q .body)
          printf '%s\n\n%s\n' "$BODY" "$(cat docs/release-verification.md)" > /tmp/notes.md
          gh release edit "${{ github.ref_name }}" --notes-file /tmp/notes.md
