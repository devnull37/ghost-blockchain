# cargo-deny configuration for the Ghost tree.
# cargo-audit (rustsec advisories) runs in a sibling CI job; this file adds
# license, ban, duplicate-version, and source controls on top.

[graph]
all-features = false

[licenses]
# Permissive set covering the Substrate/Polkadot dependency tree plus the
# crates we added. Additions must be justified in the PR that adds them —
# never loosen this list to silence a new dependency.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # Parity licenses the Substrate *client* crates (sc-service, sc-cli,
    # sc-network, sc-basic-authorship, ...) as GPLv3 + Classpath exception:
    # the exception explicitly says linking does NOT create a derivative
    # work — it is the mechanism that lets a Substrate binary ship without
    # GPL propagation. Runtime/Wasm crates are Apache-2.0; this allow entry
    # covers the node-side client stack only.
    "GPL-3.0-or-later WITH Classpath-exception-2.0",
]

# ring 0.16.20's manifest license field ("Apache-2.0/GPL-3.0") is not a
# valid SPDX expression, so cargo-deny treats the crate as unlicensed.
# ring's LICENSE file is the well-known ISC-style ring license; clarify it
# with the expression cargo-deny's own docs use for ring.
[[licenses.clarify]]
name = "ring"
version = "0.16.20"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Substrate pulls many legitimate duplicate versions (syn 1/2, semver,
# etc.) — warn rather than deny until the tree thins out.
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
# We intentionally depend on the polkadot-sdk monorepo over git (stable2407
# branch pin in Cargo.toml) — allow that org's repos only; everything else
# must come from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/paritytech/polkadot-sdk.git",
    "https://github.com/paritytech/polkadot-sdk",
]

# Advisory-DB checking is covered by the `audit` job in CI (cargo audit);
# `cargo deny check` here is limited to licenses/sources/bans.
