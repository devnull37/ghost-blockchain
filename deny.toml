# cargo-deny configuration for the Ghost tree.
# cargo-audit (rustsec advisories) runs in a sibling CI job; this file adds
# license, ban, duplicate-version, and source controls on top.

[graph]
all-features = false

[licenses]
# Permissive set covering the Substrate/Polkadot dependency tree plus the
# crates we added. Additions must be justified in the PR that adds them —
# never loosen this list to silence a new dependency.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # Parity licenses the Substrate *client* crates (sc-service, sc-cli,
    # sc-network, sc-basic-authorship, ...) as GPLv3 + Classpath exception:
    # the exception explicitly says linking does NOT create a derivative
    # work — it is the mechanism that lets a Substrate binary ship without
    # GPL propagation. Runtime/Wasm crates are Apache-2.0; this allow entry
    # covers the node-side client stack only.
    "GPL-3.0-or-later WITH Classpath-exception-2.0",
]

# Parity's polkadot-node-side crates are licensed plain `GPL-3.0-only`
# (no Classpath exception). They enter our tree only through
# `frame-benchmarking-cli` -> `cumulus-client-parachain-inherent`, i.e.
# they are compiled into the ghost-node *binary* — `cargo tree -p
# solochain-template-runtime` confirms none reach the Wasm runtime. Since
# the node binary already links GPL client crates (the sc-* stack above),
# shipping these under GPL-3.0-only is the same posture every Substrate
# node has (polkadot's own binary is GPL-3.0). Exception, not a global
# allow, so no *new* crate can pull GPL-3.0-only unnoticed.
[[licenses.exceptions]]
name = "polkadot-core-primitives"
version = "16"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "polkadot-node-metrics"
version = "21"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "polkadot-node-network-protocol"
version = "21"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "polkadot-node-primitives"
version = "17"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "polkadot-node-subsystem-types"
version = "21"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "polkadot-overseer"
version = "21"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "polkadot-parachain-primitives"
version = "15"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "polkadot-primitives"
version = "17"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "polkadot-statement-table"
version = "17"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "staging-xcm"
version = "15"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "tracing-gum"
version = "17"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "tracing-gum-proc-macro"
version = "5"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "xcm-procedural"
version = "11"
allow = ["GPL-3.0-only"]

# ring 0.16.20's manifest license field ("Apache-2.0/GPL-3.0") is not a
# valid SPDX expression, so cargo-deny treats the crate as unlicensed.
# ring's LICENSE file is the well-known ISC-style ring license; clarify it
# with the expression cargo-deny's own docs use for ring.
[[licenses.clarify]]
name = "ring"
version = "0.16.20"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Substrate pulls many legitimate duplicate versions (syn 1/2, semver,
# etc.) — warn rather than deny until the tree thins out.
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
# We intentionally depend on the polkadot-sdk monorepo over git (stable2407
# branch pin in Cargo.toml) — allow that org's repos only; everything else
# must come from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/paritytech/polkadot-sdk.git",
    "https://github.com/paritytech/polkadot-sdk",
]

# Advisory-DB checking is covered by the `audit` job in CI (cargo audit);
# `cargo deny check` here is limited to licenses/sources/bans.
