[package]
name = "ghost-consensus"
version = "0.1.0"
description = "Ghost PoW consensus engine: PowAlgorithm implementation, mining helpers, heaviest-chain selection, and aux persistence on top of sc-consensus-pow"
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
# Client-side crate: the primitives' std-gated code (decl_runtime_apis client
# surface) requires the std feature.
ghost-pow-primitives = { workspace = true, features = ["std"] }
# Matches the version already resolved in Cargo.lock via sc-consensus-pow.
async-trait = "0.1.89"
codec.workspace = true
sc-client-api.workspace = true
sc-consensus-pow.workspace = true
sc-consensus.workspace = true
sp-api.workspace = true
sp-blockchain.workspace = true
sp-consensus.workspace = true
sp-consensus-pow.workspace = true
sp-core.workspace = true
sp-crypto-hashing.workspace = true
sp-runtime.workspace = true

[dev-dependencies]
proptest.workspace = true
sp-runtime = { workspace = true, features = ["std"] }

[lints]
workspace = true
