[package]
name = "pallet-ghost-pqc"
description = "On-chain Dilithium5/ML-DSA-87 public key registry with proof-of-possession for the Ghost blockchain."
version = "0.0.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }

# frame deps
frame-benchmarking = { optional = true, workspace = true, default-features = false }
frame-support = { workspace = true, default-features = false }
frame-system = { workspace = true, default-features = false }

# Substrate primitives
sp-core = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }

# Pure-Rust ML-DSA-87 (FIPS-204) verifier; #![no_std] so it links into the Wasm
# runtime. Verification MUST NOT be gated behind the `std` feature — see
# docs/ghost-consensus-design.md section 8.
# NOTE: the doc's first choice `pqc_dilithium` cannot be used — no `0.5` release
# exists on crates.io and the latest (0.2.0) hard-depends on `rand`/`getrandom`
# (std-only; fails to compile wasm32-unknown-unknown). `ml-dsa` is the doc's
# sanctioned fallback.
ml-dsa = { version = "0.1", default-features = false }

[dev-dependencies]
sp-core = { workspace = true, default-features = true }
sp-io = { workspace = true, default-features = true }
sp-runtime = { workspace = true, default-features = true }
pallet-balances = { workspace = true, default-features = true }
# Native benchmark-measurement harness (`mod measure` in `benchmarking.rs`):
# TrackingBackend runs the real generated `run_benchmark` with DB-access and
# PoV tracking that `InMemoryBackend` leaves unimplemented.
sp-state-machine = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2407" }
sp-externalities = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2407" }
sp-trie = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2407" }

[features]
default = ["std"]
std = [
    "codec/std",
    "frame-benchmarking?/std",
    "frame-support/std",
    "frame-system/std",
    "scale-info/std",
    "sp-core/std",
    "sp-runtime/std",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
]
