[package]
name = "pallet-ghost-consensus"
description = "On-chain state for Ghost hybrid PoW/PoS consensus: staking (holds), session validator selection, PoW difficulty retarget, digest-decoded block rewards, offence-driven slashing."
version = "0.0.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }

# frame deps
frame-benchmarking = { optional = true, workspace = true, default-features = false }
frame-support = { workspace = true, default-features = false }
frame-system = { workspace = true, default-features = false }
pallet-balances = { workspace = true, default-features = false }
pallet-timestamp = { workspace = true, default-features = false }
pallet-session = { workspace = true, default-features = false, features = ["historical"] }

# Substrate primitives
sp-core = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }
sp-staking = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2407", default-features = false }
sp-std = { workspace = true, default-features = false }

# Local primitives (POW_ENGINE_ID used to decode the author digest)
ghost-pow-primitives = { path = "../../primitives/ghost-pow", default-features = false }

[dev-dependencies]
sp-io = { workspace = true, default-features = true }
sp-runtime = { workspace = true, default-features = true }
# Native benchmark-measurement harness (`mod measure` in `benchmarking.rs`):
# TrackingBackend runs the real generated `run_benchmark` with DB-access and
# PoV tracking that `InMemoryBackend` leaves unimplemented.
sp-state-machine = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2407" }
sp-externalities = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2407" }
sp-trie = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2407" }
proptest.workspace = true

[features]
default = ["std"]
std = [
    "codec/std",
    "frame-benchmarking?/std",
    "frame-support/std",
    "frame-system/std",
    "pallet-balances/std",
    "pallet-session/std",
    "pallet-timestamp/std",
    "scale-info/std",
    "sp-core/std",
    "sp-runtime/std",
    "sp-staking/std",
    "sp-std/std",
    "ghost-pow-primitives/std",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
]
