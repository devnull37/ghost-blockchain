# cargo-audit configuration — see docs/security-advisories.md for the full
# accepted-risk register (pinning path, exposure assessment, revisit policy)
# behind every entry here. Remove an entry only when the SDK pin moves.
[advisories]
ignore = [

    "RUSTSEC-2026-0258", # h2 0.3.27 via hyper 0.14 (sc-offchain)

    "RUSTSEC-2024-0421", # idna 0.2.3/0.4.0 via url (sc-*/libp2p)

    "RUSTSEC-2026-0037",

